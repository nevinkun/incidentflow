spring:
  application:
    name: incidentflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/incidentflow
    username: ${DB_USER:incidentflow}
    password: ${DB_PASSWORD:incidentflow}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

incidentflow:
  rate-limit:
    max-requests: 100
    window-seconds: 60
  outbox:
    poll-interval-ms: 5000
    batch-size: 50
  correlation:
    window-minutes: 15
  failure-simulation:
    enabled: true
    transient-fail-attempts: 2

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%thread] [%X{eventId:-},%X{alertId:-},%X{incidentId:-},%X{fingerprint:-},%X{service:-}] %logger{36} - %msg%n"
