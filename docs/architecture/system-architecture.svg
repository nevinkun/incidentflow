<rect x="535.2" y="312" width="39.6" height="14" fill="#FFFFFF" opacity="0.92"/>
<text x="555" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">/api/*</text>
<rect x="170" y="382" width="480" height="208" rx="11" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/>
<text x="410" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#0F766E" text-anchor="middle">incidentflow-api</text>
<text x="410" y="427" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" font-style="italic" fill="#0F766E" text-anchor="middle">(Spring Boot 4.1 &#183; profile=api)</text>
<text x="200" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; rate-limit check (Redis) &#8212; runs first</text>
<text x="200" y="470.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; dedupe check, then fingerprint (SHA-256)</text>
<text x="200" y="489.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; Alert + OutboxEvent insert, 1 txn</text>
<text x="200" y="507.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; outbox publisher &#8594; Kafka, key = fingerprint</text>
<text x="200" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; REST: alerts / incidents / teams / failures</text>
<text x="200" y="544.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#134E4A" text-anchor="start">&#8226; :8080 &#8212; internal only</text>
<rect x="780" y="382" width="480" height="208" rx="11" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.8"/>
<text x="1020" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#4338CA" text-anchor="middle">incidentflow-worker</text>
<text x="1020" y="427" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" font-style="italic" fill="#4338CA" text-anchor="middle">(Spring Boot 4.1 &#183; profile=worker)</text>
<text x="810" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; consume incidentflow.alerts.received</text>
<text x="810" y="470.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; idempotency: check first, skip if already processed</text>
<text x="810" y="489.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; correlate: Redis lookup &#8594; Postgres fallback</text>
<text x="810" y="507.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; route team, escalate severity, write timeline</text>
<text x="810" y="526.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; retry w/ backoff, exclude permanent &#8594; DLT</text>
<text x="810" y="544.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#312E81" text-anchor="start">&#8226; :8081 &#8212; internal only</text>
<rect x="170" y="700" width="380" height="160" rx="11" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.8"/>
<text x="360" y="728" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#1E3A8A" text-anchor="middle">PostgreSQL &#8212; source of truth</text>
<text x="190" y="753.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E3A8A" text-anchor="start">&#8226; Alert, OutboxEvent</text>
<text x="190" y="771.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E3A8A" text-anchor="start">&#8226; Incident, IncidentTimelineEvent</text>
<text x="190" y="790.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E3A8A" text-anchor="start">&#8226; ProcessedEvent, FailureRecord</text>
<text x="190" y="808.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E3A8A" text-anchor="start">&#8226; ResponseTeam, RoutingRule</text>
<text x="190" y="827.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E3A8A" text-anchor="start">&#8226; schema managed by Flyway</text>
<rect x="610" y="700" width="290" height="160" rx="11" fill="#E2E8F0" stroke="#334155" stroke-width="1.8"/>
<text x="755" y="728" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#1E293B" text-anchor="middle">Kafka (KRaft mode)</text>
<text x="628" y="753.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E293B" text-anchor="start">&#8226; incidentflow.alerts.received</text>
<text x="628" y="771.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E293B" text-anchor="start">&#8226; &#8230;received.retry</text>
<text x="628" y="790.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E293B" text-anchor="start">&#8226; &#8230;received.dlt</text>
<text x="628" y="808.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E293B" text-anchor="start">&#8226; key = alert fingerprint</text>
<text x="628" y="827.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1E293B" text-anchor="start">&#8226; at-least-once delivery</text>
<rect x="960" y="700" width="300" height="160" rx="11" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
<text x="1110" y="728" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#991B1B" text-anchor="middle">Redis &#8212; cache only</text>
<text x="978" y="753.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#991B1B" text-anchor="start">&#8226; correlation cache (fingerprint &#8594; incidentId)</text>
<text x="978" y="771.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#991B1B" text-anchor="start">&#8226; TTL = correlation window (15 min default)</text>
<text x="978" y="790.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#991B1B" text-anchor="start">&#8226; rate-limit counters, per source</text>
<text x="978" y="808.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#991B1B" text-anchor="start">&#8226; correlation: cache-aside, Postgres fallback</text>
<text x="978" y="827.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#991B1B" text-anchor="start">&#8226; rate-limit: fails open if Redis is down</text>
