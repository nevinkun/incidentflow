<text x="800.0" y="42" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#0F172A" text-anchor="middle">IncidentFlow &#8212; System Architecture</text>
<text x="800.0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#64748B" text-anchor="middle">One Spring Boot codebase, two profiles (api / worker) &#183; single EC2 host via Docker Compose</text>
<text x="1490" y="96" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#475569" text-anchor="start">&#8212;&#8212; data flow</text>
