<rect x="40" y="180" width="1330" height="870" rx="16" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,6"/>
<text x="64" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#64748B" text-anchor="start">AWS EC2 instance (t4g.medium, Amazon Linux 2023) &#8212; Docker Compose network</text>
<rect x="520" y="218" width="280" height="80" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
<text x="660" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#92400E" text-anchor="middle">nginx &#8212; edge</text>
<text x="660" y="257" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" font-style="italic" fill="#92400E" text-anchor="middle">reverse proxy only, no static files</text>
<text x="660" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#92400E" text-anchor="middle">/ &#8594; web &#183; /api/* &#8594; api</text>
<text x="660" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.4" font-weight="normal" font-style="normal" fill="#92400E" text-anchor="middle">public :80 &#8212; only entry point</text>
<rect x="850" y="218" width="280" height="80" rx="9" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
<text x="990" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#92400E" text-anchor="middle">incidentflow-web</text>
<text x="990" y="257" font-family="Helvetica, Arial, sans-serif" font-size="9.6" font-weight="normal" font-style="italic" fill="#92400E" text-anchor="middle">(nginx:alpine + built React SPA)</text>
<text x="990" y="273" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#92400E" text-anchor="middle">serves Vite build &#183; SPA fallback</text>
<text x="990" y="288" font-family="Helvetica, Arial, sans-serif" font-size="9.4" font-weight="normal" font-style="normal" fill="#92400E" text-anchor="middle">:80 &#8212; internal only</text>
