<text x="1526" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#94A3B8" text-anchor="start">logs / metrics</text>
<rect x="610" y="88" width="380" height="58" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8"/>
<text x="800" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle">Browser &#8212; React Operator Console</text>
<text x="800" y="131" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#64748B" text-anchor="middle">TanStack Query polling every 2&#8211;5s</text>
