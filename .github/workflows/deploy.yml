name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get this runner's IP
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow SSH from this runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0aedc24753d0b364d \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/incidentflow
            git pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
            sleep 30
            curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
            curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'
            echo "Deploy verified healthy"

      - name: Revoke temporary SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-0aedc24753d0b364d \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32
