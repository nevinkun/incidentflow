services:
  postgres:
    image: postgres:16
    container_name: incidentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentflow
      POSTGRES_USER: ${POSTGRES_USER:-incidentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentflow}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incidentflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    container_name: incidentflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  kafka:
    image: apache/kafka:3.7.0
    container_name: incidentflow-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  prometheus:
    image: prom/prometheus:latest
    container_name: incidentflow-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:13.0.5
    container_name: incidentflow-grafana
    restart: unless-stopped
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
  incidentflow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidentflow-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: api
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-incidentflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-incidentflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
  incidentflow-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidentflow-worker
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-incidentflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-incidentflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
  incidentflow-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidentflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
  nginx:
    image: nginx:alpine
    container_name: incidentflow-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - incidentflow-api
      - incidentflow-web
