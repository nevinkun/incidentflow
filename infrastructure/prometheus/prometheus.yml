global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'incidentflow-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          role: api

  - job_name: 'incidentflow-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          role: worker
